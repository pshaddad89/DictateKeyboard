name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias dictatekeyboard -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "TempPassword123!" -keypass "TempPassword123!" \
            -dname "CN=DictateKeyboard, OU=Dev, O=Me, L=City, S=State, C=US"

      - name: Show base64 (copy this into KEYSTORE_BASE64 secret)
        run: base64 -w0 release.keystore

      - name: Upload keystore as backup
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: release.keystore
